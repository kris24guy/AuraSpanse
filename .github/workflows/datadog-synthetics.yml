# This workflow runs Datadog Synthetic tests when the integration is configured.
# Add repository secrets DD_API_KEY and DD_APP_KEY to enable the tests.
# If either credential is absent, the Synthetic step is explicitly skipped with a warning.
# This workflow does not replace the production build/test performed by Render.

name: Run Datadog Synthetic tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Explain skipped Datadog tests when credentials are missing
        if: ${{ !env.DD_API_KEY || !env.DD_APP_KEY }}
        run: echo "::warning::Datadog Synthetic tests skipped because DD_API_KEY and/or DD_APP_KEY are not configured as repository secrets."

      - name: Run Datadog Synthetic tests
        if: ${{ env.DD_API_KEY && env.DD_APP_KEY }}
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ env.DD_API_KEY }}
          app_key: ${{ env.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
