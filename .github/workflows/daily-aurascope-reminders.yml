name: Daily Aurascope reminders

on:
  schedule:
    # 16:00 UTC is morning in California (9 AM during PDT, 8 AM during PST).
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the protected daily reminder endpoint
        env:
          CRON_SECRET: \${{ secrets.AURASPANSE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Daily reminder delivery is not active yet. Add the AURASPANSE_CRON_SECRET repository secret and the matching CRON_SECRET Render environment variable."
            exit 0
          fi

          curl --fail-with-body --silent --show-error --max-time 540 \\
            --request POST \\
            --header "Authorization: Bearer $CRON_SECRET" \\
            "https://auraspanse.onrender.com/api/daily-reminders"
